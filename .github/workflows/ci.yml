name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,retrieval]"

      - name: Start Weaviate
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/v1/.well-known/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run tests
        env:
          WEAVIATE_INTEGRATION: "1"
        run: pytest

      - name: Stop Weaviate
        if: always()
        run: docker compose down
