<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="title description">
  <title id="title">Test poster artwork</title>
  <desc id="description">A geometric local test image used for repeatable browser checks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#background)"/>
  <circle cx="200" cy="230" r="112" fill="none" stroke="#67e8f9" stroke-width="8" opacity=".75"/>
  <path d="M88 438h224" stroke="#cbd5e1" stroke-width="5"/>
  <text x="200" y="490" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">TEST POSTER</text>
  <text x="200" y="526" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">LOCAL ARTWORK</text>
</svg>
