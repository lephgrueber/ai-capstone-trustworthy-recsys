[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-recsys"
version = "0.1.0"
description = "Retrieval, ranking, and trustworthy offline evaluation for recommendation systems."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<24",
]

[tool.setuptools.packages.find]
include = ["trustworthy_recsys*", "eval*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
